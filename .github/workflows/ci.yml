name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api:
    name: API build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ServiceFlow.slnx

      - name: Build
        run: dotnet build ServiceFlow.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ServiceFlow.slnx --no-build --configuration Release --verbosity normal

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ServiceFlow.Web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/ServiceFlow.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy API to VM
    runs-on: ubuntu-latest
    needs: [ api, web ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/ServiceFlow.Api/ServiceFlow.Api.csproj --configuration Release --output ./publish

      - name: Remove build tool folders
        run: rm -rf ./publish/BuildHost-*

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to VM
        run: rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" ./publish/ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/serviceflow/

      - name: Restart API
        run: ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "sudo systemctl restart serviceflow"

      - name: Smoke test
        run: |
          sleep 10
          curl --fail --silent --show-error https://api.suhasubasi.se/api/tickets > /dev/null